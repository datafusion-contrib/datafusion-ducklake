name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  # Without this sccache defaults to a local-disk cache under ~/.cache/sccache,
  # which nothing persists between runs — so every run started from an empty
  # cache and `RUSTC_WRAPPER` bought nothing. Points it at the Actions cache.
  SCCACHE_GHA_ENABLED: "true"
  # sccache cannot cache incrementally-compiled crates and silently declines to
  # try, which is why runs reported "Cache hits rate (Rust) 0.00 %" with ~990
  # Rust misses. Incremental state is useless in CI anyway (fresh runner, no
  # rebuild), so turning it off is what lets sccache cache Rust at all.
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    name: Check & Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        rust: [stable]
    env:
      # Smaller artifacts + faster links for the bundled-DuckDB build; disk
      # headroom itself comes from the scratch-disk step below (Linux).
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build on the runner's large scratch disk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /mnt/cargo-target
          sudo chown "$(id -un)" /mnt/cargo-target
          echo "CARGO_TARGET_DIR=/mnt/cargo-target" >> "$GITHUB_ENV"
          df -h / /mnt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e326ebed976843c9932b3aa0e021c6f50310eb4 # v0.0.6

      # One step for both cargo-home paths. As two steps, the `~/.cargo/git` one
      # logged "Path Validation Error: Path(s) ... do(es) not exist, hence no
      # cache is being saved" on every run — the crate has no git dependencies, so
      # that directory is never created. Cached together, the registry always
      # exists so the step is valid, and a future git dependency is still covered.
      - name: Cache cargo home
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-home-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-home-

      # No target-directory cache: on Linux `CARGO_TARGET_DIR` points at the scratch
      # disk above, so caching `target` saved an empty path ("Path Validation Error
      # ... no cache is being saved") — it never worked. On macOS it did work, but a
      # ~2.8 GB entry per OS competes with sccache for the repo's 10 GB cache budget
      # and evicts it. sccache (persisted via SCCACHE_GHA_ENABLED above) caches the
      # same dependency compilations far more cheaply, on both platforms.
      - name: Run clippy
        run: cargo clippy --all-targets --all-features --no-deps -- -D warnings

      - name: Run tests
        # `write-sqlite` pulls in the writer and sqlite-provider tests,
        # which are `#![cfg]`-gated; without it cargo compiles them to
        # zero-test binaries.
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cargo test --features "skip-tests-with-docker write-sqlite"
          else
            cargo test --features "write-sqlite"
          fi

      - name: Check documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test-full:
    name: Test (single-catalog backends + encryption, Docker)
    runs-on: ubuntu-latest
    env:
      # Bundled-DuckDB debug binaries are huge and this job links ~25 of them
      # under the full feature set, which exhausts the runner's disk during
      # linking (lld dies with SIGBUS). Dropping debuginfo keeps them small.
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build on the runner's large scratch disk
        run: |
          sudo mkdir -p /mnt/cargo-target
          sudo chown "$(id -un)" /mnt/cargo-target
          echo "CARGO_TARGET_DIR=/mnt/cargo-target" >> "$GITHUB_ENV"
          df -h / /mnt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e326ebed976843c9932b3aa0e021c6f50310eb4 # v0.0.6

      # One step for both cargo-home paths. As two steps, the `~/.cargo/git` one
      # logged "Path Validation Error: Path(s) ... do(es) not exist, hence no
      # cache is being saved" on every run — the crate has no git dependencies, so
      # that directory is never created. Cached together, the registry always
      # exists so the step is valid, and a future git dependency is still covered.
      - name: Cache cargo home
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-home-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-home-

      # No target-directory cache here either — `CARGO_TARGET_DIR` is the scratch
      # disk, so this only ever cached an empty `target`. See the `check` job.

      # Runs the single-catalog suites across every metadata backend
      # (Postgres/MySQL via testcontainers, SQLite, DuckDB) + encryption.
      # `skip-tests-with-docker` is NOT set, so the container-backed suites run.
      # Multicatalog (the runtimedb-specific layer, gated on `write-postgres`) is
      # intentionally excluded here — its test files stay in-tree but don't run.
      - name: Run single-catalog test suite
        run: cargo test --features "duckdb-bundled encryption metadata-mysql metadata-postgres metadata-sqlite write-sqlite"
