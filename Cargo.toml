[workspace]
members = [".", "benchmark"]

[package]
name = "datafusion-ducklake"
version = "0.6.0"
edition = "2024"
# Floor set by sqlx 0.9, which requires 1.94.
rust-version = "1.94.0"
authors = ["zac@hotdata.dev", "shefeek@hotdata.dev", "anoop@hotdata.dev"]
description = "DuckLake query engine for rust, built with datafusion."
license = "Apache-2.0"
repository = "https://github.com/hotdata-dev/datafusion-ducklake"
homepage = "https://github.com/hotdata-dev/datafusion-ducklake"
documentation = "https://docs.rs/datafusion-ducklake"
readme = "README.md"
keywords = ["datafusion", "duckdb", "ducklake", "iceberg", "datalake"]
categories = ["database", "filesystem"]
exclude = ["datafusion-ducklake.iml", "target", "tests/test_data"]
# The integration tests are one binary (`tests/it/main.rs`) with a module per
# former `tests/*.rs` file, declared explicitly below rather than auto-discovered.
autotests = false

[dependencies]
datafusion = "54"
datafusion-datasource = "54"
arrow = "58"
parquet = { version = "58", features = ["async"] }
object_store = { version = "0.13", default-features = false }
url = "2.5"
percent-encoding = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
thiserror = "2.0"

# Encryption support (optional)
base64 = { version = "0.22", optional = true }
hex = { version = "0.4", optional = true }

# Write support (optional)
uuid = { version = "1.0", features = ["v4"], optional = true }
# Used by the maintenance API (ExpireCriteria/CleanupCriteria OlderThan).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Staging file for streaming table writes (see table_writer::TableWriteSession).
tempfile = { version = "3.14", optional = true }

# Metadata providers (optional)
duckdb = { version = "1.4.1", optional = true }
sqlx = { version = "0.9", features = ["runtime-tokio"], optional = true }

[dev-dependencies]
object_store = { version = "0.13", features = ["aws", "fs"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["minio", "postgres", "mysql"] }
tempfile = "3.14"
anyhow = "1.0"
regex = "1"
aws-sdk-s3 = "1.75"
aws-credential-types = "1.2"
sqllogictest = "0.23"

[features]
default = ["metadata-duckdb", "duckdb-bundled"]

# Allow skipping tests that use docker (in CI, macos doesn't support docker).
skip-tests-with-docker = []

# Metadata provider backends
metadata-duckdb = ["dep:duckdb"]
metadata-postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/chrono"]
# `mysql-rsa` keeps non-TLS `caching_sha2_password`/`sha256_password` auth working
# (MySQL 8's default). sqlx bundled RSA unconditionally through 0.8; 0.9 split it
# into an opt-in feature, and without it those connections fail at connect time.
metadata-mysql = ["dep:sqlx", "sqlx/mysql", "sqlx/mysql-rsa", "sqlx/chrono"]
metadata-sqlite = ["dep:sqlx", "sqlx/sqlite", "sqlx/chrono"]
tls-native-tls = ["sqlx?/tls-native-tls"]
tls-rustls-aws-lc-rs = ["sqlx?/tls-rustls-aws-lc-rs"]
tls-rustls-ring = ["sqlx?/tls-rustls-ring"]

# Compile DuckDB C++ from source and statically bundle it. Enabled by default.
# Consumers who want to dynamically link against a system libduckdb can disable
# this by using `default-features = false, features = ["metadata-duckdb"]`.
duckdb-bundled = ["metadata-duckdb", "duckdb/bundled"]

# Encryption support for Parquet files
encryption = ["parquet/encryption", "datafusion/parquet_encryption", "dep:base64", "dep:hex"]

# Write support
write = ["dep:uuid", "dep:tempfile"]
write-sqlite = ["write", "metadata-sqlite"]
write-postgres = ["write", "metadata-postgres", "multicatalog-postgres"]
write-duckdb = ["write", "metadata-duckdb"]
write-mysql = ["write", "metadata-mysql"]
# Multicatalog read provider (independent of write support)
multicatalog-postgres = ["metadata-postgres"]

# Rowid verification examples need both the DuckDB extension (writes the
# catalog + writes data) and the postgres provider (DataFusion-side reads).
[[example]]
name = "compare_rowid_against_duckdb"
required-features = ["metadata-duckdb", "metadata-postgres"]

[[example]]
name = "rowid_lifecycle"
required-features = ["metadata-duckdb", "metadata-postgres"]

[[example]]
name = "multicatalog_write"
required-features = ["write-postgres"]

[[example]]
name = "compaction_demo"
required-features = ["write-sqlite"]

[[example]]
name = "maintenance_demo"
required-features = ["write-sqlite"]

[[example]]
name = "orphan_cleanup_demo"
required-features = ["write-sqlite"]

[[example]]
name = "dump_sort"
required-features = ["metadata-sqlite"]

[[example]]
name = "write_sorted"
required-features = ["write-sqlite"]

# One integration-test binary instead of one per `tests/*.rs`. Cargo links a
# separate binary per test target, and with `duckdb-bundled` on by default each
# statically linked its own copy of DuckDB — ~50 binaries at 260-430 MB apiece.
# That is what exhausted the runner's disk while linking (`lld` failing with
# SIGBUS, which `CARGO_PROFILE_TEST_DEBUG: "0"` in CI works around) and what
# inflated the cached target directory past GitHub's 10 GB per-repository budget.
# See `tests/it/main.rs`.
[[test]]
name = "it"
path = "tests/it/main.rs"

# Build the vendored DuckDB C++ optimised even in dev/test builds. `duckdb-bundled`
# is a default feature, and without this the amalgamation is compiled at the dev
# profile's `opt-level = 0` — so every test that builds a catalog through DuckDB
# runs against an unoptimised engine. Cargo passes this package's `OPT_LEVEL` to
# the `cc` invocation in its build script, so the setting reaches the C++.
#
# Measured on the full suite (601 tests, `skip-tests-with-docker write-sqlite`):
# 101.9s -> 32.6s, a 3.1x speedup. `run_all_sqllogictests` alone, the single
# longest test, goes 84.7s -> 23.2s. Only Rust code stays unoptimised, so
# debugging this crate is unaffected; DuckDB is a dependency we never step into.
#
# This costs a slower first compile of the amalgamation, which the target-directory
# cache absorbs, and ~0.3 GB more in that cache (2.5 -> 2.8 GB of object files).
#
# Scope note: `[profile]` is honoured only from the workspace root, so this
# applies to builds of this workspace — CI and contributors — and is ignored by
# downstream consumers, who pick their own profile.
[profile.dev.package.libduckdb-sys]
opt-level = 3
